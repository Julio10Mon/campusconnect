name: campusconnect
description: "CampusConnect — Plataforma móvil universitaria (Universidad Tecnológica del Valle del Mezquital)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.0
  firebase_messaging: ^15.2.0

  image_picker: ^1.1.2

  google_sign_in: ^7.1.0
  flutter_facebook_auth: ^7.1.1


  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^18.0.1
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 26

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/icons/
